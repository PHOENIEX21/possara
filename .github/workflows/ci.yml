name: Build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: possara-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3

      - name: Commit generated lockfile to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "possara-security-ci"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock dependency tree [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
